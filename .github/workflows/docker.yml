name: Docker Build

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target Docker platforms'
        required: false
        default: 'linux/amd64'

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Build, Smoke-Test & Push Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (when building multi-arch)
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (release tag vs. latest build)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.ref_type == 'tag' && !contains(github.ref_name, '-')) }}

      - name: Build image locally for container smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          tags: icehandnote-smoke:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test running Docker container (API + SPA)
        run: |
          trap 'docker logs icehandnote-ci || true; docker rm -f icehandnote-ci || true' EXIT
          docker run -d --name icehandnote-ci -p 3001:3001 icehandnote-smoke:test
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:3001/api/v1/health > /tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              echo ""
              break
            fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS http://127.0.0.1:3001/ | grep -qi '<!DOCTYPE html>'

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Version untagged build by image sha256 digest & verify pull
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          REPO_LOWER=$(echo "$REPO_SLUG" | tr '[:upper:]' '[:lower:]')
          IMAGE_LOWER="ghcr.io/${REPO_LOWER}"

          if [ "$IS_TAG" != "true" ]; then
            HEX="${DIGEST#sha256:}"
            SHA256_TAG="sha256-${HEX:0:12}"
            echo "Attaching :${SHA256_TAG} directly to manifest ${DIGEST}"

            TOKEN=$(curl -fsSL -u "${GITHUB_ACTOR}:${GH_TOKEN}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO_LOWER}:pull,push" | jq -r .token)
            HEADERS_FILE=$(mktemp)
            BODY_FILE=$(mktemp)
            curl -fsSL -D "$HEADERS_FILE" -o "$BODY_FILE" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/${REPO_LOWER}/manifests/${DIGEST}"
            CT=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/\r$/, ""); print $2; exit}' "$HEADERS_FILE")
            curl -fsSL -X PUT \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: ${CT}" \
              --data-binary @"$BODY_FILE" \
              "https://ghcr.io/v2/${REPO_LOWER}/manifests/${SHA256_TAG}" > /dev/null

            # Prune only superseded tagged non-release versions (never touch untagged child manifests with empty tags)
            PKG_NAME=$(basename "$REPO_LOWER")
            OWNER="${{ github.repository_owner }}"
            VERSIONS_JSON=$(gh api "/users/${OWNER}/packages/container/${PKG_NAME}/versions?per_page=100" 2>/dev/null || gh api "/orgs/${OWNER}/packages/container/${PKG_NAME}/versions?per_page=100" 2>/dev/null || echo "[]")
            echo "$VERSIONS_JSON" | jq -r --arg cur "$DIGEST" '
              .[] | select(.name != $cur)
              | select((.metadata.container.tags // []) | (length > 0) and all(test("^(main|master|sha-[0-9a-f]+|sha256-[0-9a-f]+)$")))
              | .id
            ' | while read -r vid; do
              [ -n "$vid" ] || continue
              gh api --method DELETE "/users/${OWNER}/packages/container/${PKG_NAME}/versions/${vid}" 2>/dev/null \
                || gh api --method DELETE "/orgs/${OWNER}/packages/container/${PKG_NAME}/versions/${vid}" 2>/dev/null \
                || true
            done

            docker pull "${IMAGE_LOWER}:${SHA256_TAG}"
            docker pull "${IMAGE_LOWER}:latest"
          else
            # Prune superseded non-release sha256-* / sha-* / main versions once a release tag is published
            PKG_NAME=$(basename "$REPO_LOWER")
            OWNER="${{ github.repository_owner }}"
            VERSIONS_JSON=$(gh api "/users/${OWNER}/packages/container/${PKG_NAME}/versions?per_page=100" 2>/dev/null || gh api "/orgs/${OWNER}/packages/container/${PKG_NAME}/versions?per_page=100" 2>/dev/null || echo "[]")
            echo "$VERSIONS_JSON" | jq -r --arg cur "$DIGEST" '
              .[] | select(.name != $cur)
              | select((.metadata.container.tags // []) | (length > 0) and all(test("^(main|master|sha-[0-9a-f]+|sha256-[0-9a-f]+)$")))
              | .id
            ' | while read -r vid; do
              [ -n "$vid" ] || continue
              gh api --method DELETE "/users/${OWNER}/packages/container/${PKG_NAME}/versions/${vid}" 2>/dev/null \
                || gh api --method DELETE "/orgs/${OWNER}/packages/container/${PKG_NAME}/versions/${vid}" 2>/dev/null \
                || true
            done
            docker pull "${IMAGE_LOWER}:${REF_NAME}"
          fi
