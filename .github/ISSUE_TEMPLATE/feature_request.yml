name: Feature Request
description: Propose a new capability or improvement for IceHandnote.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Use Case
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Proposed Solution
    validations:
      required: false
